# SPDX-License-Identifier: Apache-2.0

name: Build and Test

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish; leave empty to run tests only
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure tests
        run: cmake -S test -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  release:
    name: Create release
    needs: test
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on master
        id: on_master
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          git fetch origin master --tags
          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Release tag $RELEASE_TAG does not exist on the repository."
            exit 1
          fi

          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $RELEASE_TAG does not point to a commit on master; skipping release."
          fi

      - name: Create GitHub release
        if: steps.on_master.outputs.result == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
